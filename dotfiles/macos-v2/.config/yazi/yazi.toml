[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "git"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = [ "click", "scroll" ]
title_format = "Yazi: {cwd}"

[preview]
tab_size = 2
max_width = 1200
max_height = 1800
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15

[opener]
edit = [
  { run = '$EDITOR %s', block = true, desc = "$EDITOR" }
]
open = [
  { run = 'open %s', orphan = true, desc = "Open" }
]
video = [
  { run = 'open %s', orphan = true, desc = "Open video" }
]
reveal = [
  { run = 'open -R %s1', orphan = true, desc = "Reveal in Finder" }
]
terminal = [
  { run = 'rice-v2-open-terminal %s1', orphan = true, desc = "Open Ghostty here" }
]
extract = [
  { run = 'rice-v2-yazi-extract %s1', block = true, desc = "Extract archive here" }
]
zip = [
  { run = 'rice-v2-yazi-compress %s', block = true, desc = "Create zip archive" }
]

[open]
prepend_rules = [
  { url = "*/", use = [ "open", "terminal", "reveal" ] },
  { url = "*.torrent", use = [ "open", "reveal" ] },
  { mime = "video/*", use = [ "video", "open", "reveal" ] },
  { url = "*.{zip,rar,7z,tar,gz,tgz,bz2,xz}", use = [ "extract", "open", "reveal" ] },
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  { mime = "application/json", use = [ "edit", "open", "reveal" ] },
  { url = "*.{md,toml,yaml,yml,json,jsonc,py,js,ts,tsx,jsx,rs,go,sh,zsh,lua,css,html}", use = [ "edit", "open", "reveal" ] }
]

[plugin]
prepend_previewers = [
  { mime = "video/*", run = "video-info" }
]
prepend_fetchers = [
  { mime = "video/*", run = "video-info", group = "video-info" },
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" }
]
prepend_spotters = [
  { mime = "video/*", run = "video-info" }
]
