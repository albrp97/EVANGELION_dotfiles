id = "evangelion/control-center"
name = "EVA Control Center"
version = "0.1.0"
plugin_api = 12
author = "evangelion"
license = "MIT"
dependencies = []
tags = ["eva", "system", "native"]
icon = "device-desktop"
description = "EVA-styled hover capsules for Noctalia's native panels and workspace dots."

[[widget]]
id = "power"
entry = "widget.luau"

    [[widget.setting]]
    key = "metric"
    type = "string"
    default = "power"
    label_key = "metric"

