[accessibility]
ui_scale = 1.20

[bar.default]
center = [ "group:g_workspace" ]
concave_edge_corners = true
end = [ "group:g_media", "group:g_volume", "group:g_weather", "group:g_notifications", "group:g_profile" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
widget_spacing = 10
background_opacity = 0.0
border_width = 0
contact_shadow = false
shadow = false
start = [
  "group:g_power",
  "group:g_clock",
  "group:g_system",
  "group:g_network",
]
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_power"
    members = [ "eva_power" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_clock"
    members = [ "eva_clock" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_system"
    members = [ "eva_cpu", "eva_ram", "eva_gpu" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_network"
    members = [ "eva_download", "eva_upload" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_workspace"
    members = [ "eva_workspace" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_media"
    members = [ "eva_media" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_volume"
    members = [ "eva_volume" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_weather"
    members = [ "eva_weather" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_notifications"
    members = [ "eva_notifications" ]
    opacity = 0.75
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g_profile"
    members = [ "eva_profile" ]
    opacity = 0.75
    padding = 10.0

[control_center]
hidden_tabs = []
show_session_button = true
show_shortcut_labels = true
sidebar = "full"
sidebar_section = "full"
width = 780

[plugins]
enabled = [ "evangelion/control-center" ]

[location]
auto_locate = true

[weather]
enabled = true
unit = "metric"

[shell]
button_borders = true
card_borders = true
corner_radius_scale = 0.90
clipboard_image_action_command = "satty -f -"
font_family = "Liga SFMono Nerd Font"
lang = "en"
input_borders = true
launch_apps_as_systemd_services = true
polkit_agent = true
popup_borders = true
popup_shadows = false
settings_show_advanced = true

    [shell.animation]
    enabled = true
    speed = 0.85

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    borders = true
    control_center_placement = "attached"
    list_item_background = true
    open_near_click_control_center = true
    shadow = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "solid"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
cpu_poll_seconds = 2.0
gpu_poll_seconds = 2
memory_poll_seconds = 2.0
network_poll_seconds = 2.0

[theme]
mode = "dark"
source = "custom"
custom_palette = "eva01"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt", "alacritty" ]

[widget.eva_power]
type = "evangelion/control-center:power"

    [widget.eva_power.actions]
    left = "panel-open session"

[widget.eva_clock]
type = "evangelion/control-center:clock"

    [widget.eva_clock.actions]
    left = "panel-open control-center calendar"

[widget.eva_cpu]
type = "evangelion/control-center:cpu"

    [widget.eva_cpu.actions]
    left = "panel-open control-center system"

[widget.eva_ram]
type = "evangelion/control-center:ram"

    [widget.eva_ram.actions]
    left = "panel-open control-center system"

[widget.eva_gpu]
type = "evangelion/control-center:gpu"

    [widget.eva_gpu.actions]
    left = "panel-open control-center system"

[widget.eva_download]
type = "evangelion/control-center:download"

    [widget.eva_download.actions]
    left = "panel-open control-center network"

[widget.eva_upload]
type = "evangelion/control-center:upload"

    [widget.eva_upload.actions]
    left = "panel-open control-center network"

[widget.eva_workspace]
type = "evangelion/control-center:workspace"

    [widget.eva_workspace.actions]
    left = "panel-open control-center home"

[widget.eva_media]
type = "evangelion/control-center:media"

    [widget.eva_media.actions]
    left = "panel-open control-center media"

[widget.eva_volume]
type = "evangelion/control-center:volume"

    [widget.eva_volume.actions]
    left = "panel-open control-center audio"

[widget.eva_weather]
type = "evangelion/control-center:weather"

    [widget.eva_weather.actions]
    left = "panel-open control-center weather"

[widget.eva_notifications]
type = "evangelion/control-center:notifications"

    [widget.eva_notifications.actions]
    left = "panel-open control-center notifications"

[widget.eva_profile]
type = "evangelion/control-center:power-profile"
