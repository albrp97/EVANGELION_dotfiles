[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "git"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = [ "click", "scroll" ]
title_format = "Yazi: {cwd}"

[preview]
tab_size = 2
max_width = 1200
max_height = 1800
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15

[opener]
edit = [
  { run = 'code --reuse-window %s', orphan = true, desc = "VS Code" },
  { run = '$EDITOR %s', block = true, desc = "$EDITOR" }
]
open = [
  { run = 'xdg-open %s', orphan = true, desc = "Open" }
]
video = [
  { run = 'uwsm app -- smplayer %s', orphan = true, desc = "SMPlayer" }
]
reveal = [
  { run = 'dolphin --select %s1', orphan = true, desc = "Reveal in Dolphin" }
]
code_dir = [
  { run = 'code --reuse-window %s1', orphan = true, desc = "Open folder in VS Code" }
]
terminal = [
  { run = 'kitty --directory %s1', orphan = true, desc = "Open Kitty here" }
]
torrent = [
  { run = '$HOME/.local/bin/qbittorrent %s', orphan = true, desc = "Open in qBittorrent" }
]
extract = [
  { run = '$HOME/.local/bin/rice-yazi-extract %s1', block = true, desc = "Extract archive here" }
]
zip = [
  { run = '$HOME/.local/bin/rice-yazi-compress %s', block = true, desc = "Create zip archive" }
]

[open]
prepend_rules = [
  { url = "*/", use = [ "open", "code_dir", "terminal", "reveal" ] },
  { url = "*.torrent", use = [ "torrent", "open", "reveal" ] },
  { mime = "video/*", use = [ "video", "open", "reveal" ] },
  { url = "*.{zip,rar,7z,tar,gz,tgz,bz2,xz}", use = [ "extract", "open", "reveal" ] },
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  { mime = "application/json", use = [ "edit", "open", "reveal" ] },
  { url = "*.{md,toml,yaml,yml,json,jsonc,py,js,ts,tsx,jsx,rs,go,sh,zsh,lua,css,html}", use = [ "edit", "open", "reveal" ] }
]

[plugin]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" }
]
