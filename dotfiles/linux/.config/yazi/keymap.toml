[mgr]
prepend_keymap = [
  { on = [ "l" ], run = "plugin smart-enter", desc = "Enter directory or open file" },
  { on = [ "<Right>" ], run = "plugin smart-enter", desc = "Enter directory or open file" },
  { on = [ "<Enter>" ], run = "plugin smart-enter", desc = "Enter directory or open file" },

  { on = [ "'", "h" ], run = "cd ~", desc = "Go home" },
  { on = [ "'", "c" ], run = "cd ~/Documents/code", desc = "Go code" },
  { on = [ "'", "d" ], run = "cd ~/Downloads", desc = "Go Downloads" },
  { on = [ "'", "D" ], run = "cd ~/Documents", desc = "Go Documents" },
  { on = [ "'", "." ], run = "cd ~/.config", desc = "Go .config" },
  { on = [ "'", "p" ], run = "cd ~/Pictures", desc = "Go Pictures" },
  { on = [ "'", "m" ], run = "cd ~/Movies", desc = "Go Movies" },
  { on = [ "'", "t" ], run = "cd /tmp", desc = "Go tmp" },
  { on = [ "'", "w" ], run = 'shell -- "$HOME/.local/bin/rice-yazi-windows"', desc = "Mount and go to Windows files" },

  { on = [ ";", "c" ], run = 'shell -- code "$PWD"', desc = "Open current folder in VS Code" },
  { on = [ ";", "t" ], run = 'shell -- kitty --directory "$PWD"', desc = "Open Kitty here" },
  { on = [ ";", "f" ], run = "shell -- dolphin --select %h", desc = "Reveal hovered item in Dolphin" },
  { on = [ ";", "s" ], run = 'shell "$SHELL" --block', desc = "Drop to shell here" },
  { on = [ ";", "o" ], run = "shell -- xdg-open %h", desc = "Open with default application" },
  { on = [ ";", "p" ], run = "plugin smart-paste", desc = "Paste into hovered dir or CWD" },
  { on = [ ";", "/" ], run = "plugin smart-filter", desc = "Smart filter" },
  { on = [ ";", "x" ], run = 'shell -- "$HOME/.local/bin/rice-yazi-extract" %h', desc = "Extract hovered archive into same-named folder" },
  { on = [ ";", "z" ], run = 'shell -- "$HOME/.local/bin/rice-yazi-compress" %s', desc = "Zip selected files or folders" },
  { on = [ ";", "Z" ], run = 'shell -- "$HOME/.local/bin/rice-yazi-compress" %h', desc = "Zip hovered file or folder" },
  { on = [ ";", "v" ], run = "plugin toggle-pane min-preview", desc = "Toggle preview pane" },
  { on = [ ";", "V" ], run = "plugin toggle-pane max-preview", desc = "Maximize or restore preview" },
  { on = [ ";", "m" ], run = "plugin chmod", desc = "Change selected file modes" },
  { on = [ ";", "g" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Go Git root" },
  { on = [ ";", "." ], run = "hidden toggle", desc = "Toggle hidden files" },
  { on = [ ";", "l", "g" ], run = "linemode git", desc = "Line mode: Git status" },
  { on = [ ";", "l", "s" ], run = "linemode size", desc = "Line mode: size" },
  { on = [ ";", "l", "m" ], run = "linemode mtime", desc = "Line mode: modified time" },
  { on = [ ";", "l", "n" ], run = "linemode none", desc = "Line mode: none" },
  { on = [ "." ], run = "hidden toggle", desc = "Toggle hidden files" },
  { on = [ "<C-o>" ], run = "open --interactive", desc = "Open with..." }
]
