[General]
mplayer_bin=/usr/bin/mpv
remember_media_settings=true
remember_time_pos=true
remember_stream_settings=false

[%General]
use_hwac3=false

[gui]
compact_mode=true
stay_on_top=1
resize_method=0
qt_style=Fusion
iconset=eva01
save_window_size_on_exit=true
default_size=@Size(640 360)
fullscreen=false
start_in_fullscreen=false
center_window=false
auto_add_to_playlist=true
media_to_add_to_playlist=0
use_player_shortcuts_in_playlist=false
dockable_playlist=true

[floating_control]
display_in_compact_mode=false

[default_gui]
compact_toolbar1_was_visible=false
fullscreen_toolbar1_was_visible=false
actions\controlwidget\1=play_or_pause, timeslider_action, fullscreen
actions\controlwidget_mini\1=play_or_pause, timeslider_action, fullscreen
actions\floating_control\1=play_or_pause, timeslider_action, fullscreen

[defaults]
preferred_audio_track=2
